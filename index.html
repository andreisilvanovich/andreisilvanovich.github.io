<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оплата отдела исполнения — АГР и ПНО</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a78d6">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Оплата АГР">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{color-scheme:light dark;
    --bg:#f4f3f0;--card:#fcfcfb;--line:#dedcd6;--tx:#0b0b0b;--mut:#7b7a75;--s1:#2a78d6;--neg:#c23636}
  @media (prefers-color-scheme:dark){:root{--bg:#111110;--card:#1a1a19;--line:#3a3a37;--tx:#fff;--mut:#95948c;--s1:#3987e5;--neg:#e66767}}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:300px;text-align:center}
  .logo{width:56px;height:56px;border-radius:14px;background:var(--s1);color:#fff;font-weight:800;font-size:17px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  h1{font-size:17px;margin:0 0 4px}
  p{font-size:13px;color:var(--mut);margin:0 0 16px}
  input{width:100%;box-sizing:border-box;font-size:22px;text-align:center;letter-spacing:6px;padding:10px;border:1.5px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--tx);outline:none}
  input:focus{border-color:var(--s1)}
  button{width:100%;margin-top:12px;padding:12px;font-size:15px;font-weight:650;border:0;border-radius:10px;
    background:var(--s1);color:#fff;cursor:pointer}
  .err{color:var(--neg);font-size:12.5px;height:16px;margin-top:8px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">АГР</div>
  <h1>Оплата отдела исполнения</h1>
  <p>Введите пароль отдела</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus>
  <button id="go">Открыть</button>
  <div class="err" id="err"></div>
</div>

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function cat(a,b){var r=new Uint8Array(a.length+b.length);r.set(a,0);r.set(b,a.length);return r;}
async function derive(pw,salt){
  var h=await crypto.subtle.digest('SHA-256',cat(salt,new TextEncoder().encode(pw)));
  for(var i=1;i<ITER;i++) h=await crypto.subtle.digest('SHA-256',h);
  return h;
}
async function tryOpen(pw,silent){
  try{
    var raw=b64(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
    var bits=await derive(pw,salt);
    var key=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    try{localStorage.setItem('agrpw',pw);}catch(_){}
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
    return true;
  }catch(e){
    if(!silent)document.getElementById('err').textContent='Неверный пароль';
    return false;
  }
}
document.getElementById('go').addEventListener('click',function(){tryOpen(document.getElementById('pw').value,false);});
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryOpen(this.value,false);});
try{var s=localStorage.getItem('agrpw');if(s)tryOpen(s,true);}catch(_){}
